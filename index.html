<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro de Ingresos y Gastos</title>

<!-- Manifest para PWA -->
<link rel="manifest" href="manifest.json">

<!-- Librería de gráficas -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* =========================================================
   MINI DESIGN SYSTEM — ZOMOZ (FINTECH / SaaS)
========================================================= */
:root {
  --z-black: #0f0f10;
  --z-black-soft: #1a1a1c;

  --z-accent: #ff8c00;
  --z-accent-soft: #ffb457;

  --z-bg: #f5f5f5;
  --z-surface: #ffffff;
  --z-border: #e3e3e3;

  --z-success: #1f8f4a;
  --z-error: #a32020;

  --z-text-main: #111;
  --z-text-soft: #666;
}

/* =========================================================
   BASE
========================================================= */
body {
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--z-bg);
  margin: 0;
  padding: 20px;
  color: var(--z-text-main);
}

h2 {
  text-align: center;
  font-weight: 700;
  letter-spacing: -0.4px;
}

/* =========================================================
   LOGIN
========================================================= */
#loginBox {
  max-width: 350px;
  margin: auto;
  background: var(--z-surface);
  padding: 25px;
  border-radius: 12px;
  border: 1px solid var(--z-border);
  box-shadow: 0 8px 22px rgba(0,0,0,0.08);
}

#loginBox button {
  background: var(--z-black);
}

#loginFooter {
  opacity: 0.6;
  font-size: 13px;
}

#app {
  display: none;
}

/* =========================================================
   FORMULARIOS
========================================================= */
form {
  max-width: 450px;
  margin: auto;
  background: var(--z-surface);
  padding: 24px;
  border-radius: 12px;
  border: 1px solid var(--z-border);
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

label {
  display: block;
  margin-top: 16px;
  font-weight: 500;
  color: var(--z-text-soft);
}

input, select, textarea {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  border-radius: 8px;
  font-size: 16px;
  background: #fafafa;
  border: 1px solid var(--z-border);
  transition: border .2s ease, box-shadow .2s ease;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--z-accent);
  box-shadow: 0 0 0 3px rgba(255,140,0,0.15);
}

/* =========================================================
   BOTÓN PRINCIPAL (REFINADO)
========================================================= */
button {
  margin-top: 20px;
  width: 100%;
  background: linear-gradient(135deg, var(--z-black), #000);
  color: #fff;
  padding: 12px;
  font-size: 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform .2s ease, box-shadow .2s ease;
  box-shadow: 0 8px 22px rgba(0,0,0,0.35);
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 32px rgba(0,0,0,0.45);
}

button:active {
  transform: scale(0.96);
}

button::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -130%;
  width: 60%;
  height: 220%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.18),
    transparent
  );
  transform: skewX(-25deg);
}

button:hover::after {
  animation: zomozShine .9s ease forwards;
}

@keyframes zomozShine {
  from { left: -130%; }
  to { left: 180%; }
}

/* =========================================================
   BOTÓN LOADING / SUCCESS (SIN JS)
========================================================= */
.btn-submit {
  height: 48px;
}

.btn-submit.is-loading {
  width: 48px;
  border-radius: 50%;
  pointer-events: none;
}

.btn-text {
  transition: opacity .2s ease;
}

.btn-submit.is-loading .btn-text {
  opacity: 0;
}

.btn-check {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  opacity: 0;
}

.btn-submit.is-success .btn-check {
  opacity: 1;
}

/* =========================================================
   SUCCESS / ERROR
========================================================= */
.success {
  display: none;
  background: rgba(31,143,74,0.12);
  color: var(--z-success);
  padding: 12px;
  margin-top: 16px;
  border-radius: 8px;
  text-align: center;
  font-weight: 500;
}

.success::before {
  content: "✔";
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  margin-right: 8px;
  background: var(--z-success);
  color: #fff;
  border-radius: 50%;
}

.errorMsg {
  display: none;
  background: rgba(163,32,32,0.12);
  color: var(--z-error);
  padding: 12px;
  margin-top: 16px;
  border-radius: 8px;
  text-align: center;
}

/* =========================================================
   DASHBOARD
========================================================= */
#dashboard {
  max-width: 600px;
  margin: 40px auto 0;
  background: var(--z-surface);
  padding: 24px;
  border-radius: 12px;
  border: 1px solid var(--z-border);
}

.stats {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  text-align: center;
}

.card {
  flex: 1;
  background: #fbfbfb;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--z-border);
}

#statBalance {
  font-size: 22px;
  font-weight: 700;
}

canvas {
  margin-top: 32px;
}

/* =========================================================
   LOGIN MESSAGE
========================================================= */
#welcomeMsg {
  display: none;
  max-width: 450px;
  margin: 20px auto;
  background: rgba(255,140,0,0.12);
  color: var(--z-black);
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-weight: 600;
}

.fade-out {
  opacity: 0;
  transition: opacity .4s ease;
}

  /* =========================================================
   MOBILE-FIRST FINO — ZOMOZ
========================================================= */
@media (max-width: 768px) {

  body {
    padding: 12px;
  }

  h2 {
    font-size: 20px;
  }

  form,
  #dashboard,
  #loginBox {
    max-width: 100%;
    padding: 20px;
    margin: 0 auto 20px;
  }

  label {
    font-size: 14px;
  }

  input,
  select,
  textarea {
    font-size: 16px;
    padding: 14px;
  }

  button {
    height: 48px;
    font-size: 17px;
  }

  /* Stats en columna (lectura clara) */
  .stats {
    flex-direction: column;
    gap: 12px;
  }

  .card {
    width: 100%;
  }

  #statBalance {
    font-size: 24px;
  }

  canvas {
    margin-top: 28px;
  }

  /* Login más centrado visualmente */
  #loginBox {
    margin-top: 8vh;
  }

  #loginLogo {
    margin-top: 24px;
  }

  #loginFooter {
    margin-top: 12px;
  }

}

  
</style>
  
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Acceso privado</h2>
  <label>Usuario</label>
  <input id="user" type="text">

  <label>Contraseña</label>
  <input id="pass" type="password">

  <button onclick="login()">Entrar</button>
</div>

  <div id="welcomeMsg"></div>

<!-- FOOTER SOLO PARA LOGIN -->
<footer id="loginFooter" style="text-align:center; padding:20px; margin-top:20px; color:#555; font-size:14px;">
  © 2025 ZOMOZ Estudio Creativo — Todos los derechos reservados.<br>
  Desarrollado por <strong>ZOMOZ Estudio Creativo</strong>.
</footer>

<!-- LOGO SOLO PARA LOGIN -->
<div id="loginLogo" style="text-align:center; margin-top:40px;">
  <img src="https://raw.githubusercontent.com/FerProducer/zomozwebINICIO/refs/heads/main/ZOMOZ%20letras%20rojonaranja.png"
       alt="Desarrollado por ZOMOZ Estudio Creativo"
       style="width:120px; opacity:0.9;">
</div>

  
<!-- APP -->
<div id="app">

  <button onclick="logout()" style="background:#b33;margin-bottom:20px;">
  Cerrar sesión
  </button>

<h2>Registro de Ingresos y Gastos</h2>

<form id="financeForm">
  
  <label for="tipo">Tipo:</label>
  <select id="tipo" name="tipo" required>
    <option value="">Selecciona...</option>
    <option value="Ingreso">Ingreso</option>
    <option value="Gasto">Gasto</option>
  </select>

  <label for="categoria">Categoría:</label>
  <input type="text" id="categoria" name="categoria" placeholder="Ej. Comida, gasolina, venta..." required />

  <label for="monto">Monto (MXN):</label>
  <input type="number" id="monto" name="monto" step="0.01" required />

  <label for="descripcion">Descripción:</label>
  <textarea id="descripcion" name="descripcion" rows="3" placeholder="Descripción opcional"></textarea>

  <label for="fecha">Fecha:</label>
  <input type="date" id="fecha" name="fecha" required />

  <button type="submit" class="btn-submit">
  <span class="btn-text">Registrar</span>
  <span class="btn-check">✓</span>
</button>


  <div class="success" id="successMsg">¡Registro guardado correctamente!</div>

  <div class="errorMsg" id="errorMsg">Error al guardar. Intenta nuevamente.</div>

  
</form>

<!-- DASHBOARD -->
<div id="dashboard">
  <h2>Dashboard</h2>

  <div class="stats">
    <div class="card">
      <h3>Ingresos</h3>
      <p id="statIngresos">$0</p>
    </div>
    <div class="card">
      <h3>Gastos</h3>
      <p id="statGastos">$0</p>
    </div>
    <div class="card">
      <h3>Balance</h3>
      <p id="statBalance">$0</p>
    </div>
  </div>

  <canvas id="chart"></canvas>
</div>

</div> <!-- END APP -->

<script>

/* ----------- CONFIGURACIÓN DE USUARIOS ------------- */
const USERS = {
  "admin": {
    pass: "040500",
    api: "https://script.google.com/macros/s/AKfycbz0k9rW9NIP7SLKhYG-9c9fbESCbmVtZ84t17xhJiAO2erIujxvRIzb6Gi4dN8HS5fL/exec"
  },
  "fernanda": {
    pass: "4321",
    api: "https://script.google.com/macros/s/AKfycbzsvnCMdWVV2U2JoyUGl_6N8moL_Bm8PfNa3kv1FBeMDYdyjyonRfFMvvF2J8iEPALw/exec"
  },
  "juan": {
    pass: "JuanMP8",
    api: "https://script.google.com/macros/s/AKfycbz35kDajP76mZoGD02OKLPn1xHm0R3fpkTIshrJMipcVhT8UHu3oS2XF8TB9Cmoj043/exec"
  },
 "panaderia":{
    pass:"061124",
    api:"https://script.google.com/macros/s/AKfycby6FTs-PbyB2Zo8WkUSacgxR4qIob_ClpARUlGkpFkbvt8mTXp-gCbh9YEKnX1xaudF-Q/exec"
  }
};


let CURRENT_API = null;

/* ----------- LOGIN PRIVADO ------------- */
function login() {
  const u = document.getElementById("user").value.toLowerCase();
  const p = document.getElementById("pass").value;

  if (USERS[u] && USERS[u].pass === p) {
    CURRENT_API = USERS[u].api;
    localStorage.setItem("logged", u);

    // OCULTAR LOGIN + FOOTER + LOGO
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("loginFooter").style.display = "none";
    document.getElementById("loginLogo").style.display = "none";

    const msg = document.getElementById("welcomeMsg");
msg.textContent = `Sesión iniciada como: ${u.toUpperCase()}`;
msg.style.display = "block";

// Desaparecer en 1.7 segundos
setTimeout(() => {
  msg.classList.add("fade-out");
}, 1700);

// Ocultar completamente después del fade
setTimeout(() => {
  msg.style.display = "none";
  msg.classList.remove("fade-out");
}, 2100);


    // MOSTRAR APP
    document.getElementById("app").style.display = "block";

    loadDashboard();
  } else {
    alert("Credenciales incorrectas");
  }
}

const savedUser = localStorage.getItem("logged");
if (savedUser && USERS[savedUser]) {
  CURRENT_API = USERS[savedUser].api;

  // AUTOLOGIN → OCULTAR LOGIN Y MOSTRAR APP
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("loginFooter").style.display = "none";
  document.getElementById("loginLogo").style.display = "none";

  document.getElementById("app").style.display = "block";
  loadDashboard();
}

/* ------------- LOGOUT -------------- */
function logout(){
  localStorage.removeItem("logged");
  location.reload();
}

/* ----------- REGISTRO EN GOOGLE SHEETS ------------- */
document.getElementById("financeForm").addEventListener("submit", function(e){
  e.preventDefault();

  if(!CURRENT_API){
    alert("Error: No se detectó usuario. Inicia sesión.");
    return;
  }

  const btn = this.querySelector(".btn-submit");

  btn.classList.add("is-loading");

  const data = {
    tipo: document.getElementById("tipo").value,
    categoria: document.getElementById("categoria").value,
    monto: parseFloat(document.getElementById("monto").value),
    descripcion: document.getElementById("descripcion").value,
    fecha: document.getElementById("fecha").value
  };

  fetch(CURRENT_API, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(() => {

    // Success visual
    btn.classList.add("is-success");

    if (navigator.vibrate) navigator.vibrate(40);

    document.getElementById("successMsg").style.display = "block";
    document.getElementById("errorMsg").style.display = "none";
    document.getElementById("financeForm").reset();

    setTimeout(() => {
      btn.classList.remove("is-loading", "is-success");
      document.getElementById("successMsg").style.display = "none";
    }, 1600);

    loadDashboard();
  });
});



/* ----------- DASHBOARD AUTOMÁTICO ------------- */
async function loadDashboard() {
  if(!CURRENT_API) return;

  const res = await fetch(CURRENT_API);
  const rows = await res.json();

  let ingresos = 0;
  let gastos = 0;
  let meses = {};
  
  rows.forEach(r => {
    const monto = parseFloat(r[3]);
    const tipo = r[1];
    const fecha = r[5].substring(0,7);

    if (!meses[fecha]) meses[fecha] = 0;

    // Redondeo mientras se acumula
    meses[fecha] = parseFloat((meses[fecha] + (tipo === "Ingreso" ? monto : -monto)).toFixed(2));

    if (tipo === "Ingreso") ingresos = parseFloat((ingresos + monto).toFixed(2));
    if (tipo === "Gasto") gastos = parseFloat((gastos + monto).toFixed(2));
  });

  document.getElementById("statIngresos").textContent = "$" + ingresos.toFixed(2);
  document.getElementById("statGastos").textContent = "$" + gastos.toFixed(2);
  document.getElementById("statBalance").textContent = "$" + (ingresos - gastos).toFixed(2);

  updateChart(meses);
}

/* ----------- GRÁFICA MENSUAL ------------- */
let chart;

function updateChart(meses) {
  const labels = Object.keys(meses);

  // Redondeo forzado para la gráfica
  const values = Object.values(meses).map(v => parseFloat(v.toFixed(2)));

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Balance mensual",
        data: values,
        borderWidth: 2
      }]
    }
  });
}

</script>

</body>
</html>
